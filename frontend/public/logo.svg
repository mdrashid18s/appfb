<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Clean White Canvas -->
    <linearGradient id="bgGradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Vibrant Orange Swoosh Gradient -->
    <linearGradient id="orangeGradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Golden Tassel Gradient -->
    <linearGradient id="goldGradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="crispShadowRoot" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean White Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradRoot)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#e2e8f0" stroke-width="3" />

  <g filter="url(#crispShadowRoot)">
    <!-- 1. GRADUATION CAP (MORTARBOARD) ON TOP OF 'X' -->
    <g transform="translate(170, 115) rotate(-14)">
      <!-- Diamond Top -->
      <path d="M 0 -32 L 60 -10 L 0 12 L -60 -10 Z" fill="#ea580c" />
      <!-- Cap Base -->
      <path d="M -30 0 L -30 16 C -30 28 30 28 30 16 L 30 0 L 0 10 Z" fill="#c2410c" />
      <!-- Gold Tassel -->
      <path d="M 60 -10 L 70 12 L 70 32" stroke="url(#goldGradRoot)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="70" cy="34" r="4" fill="#f59e0b" />
      <circle cx="0" cy="-10" r="3.5" fill="#fef08a" />
    </g>

    <!-- 2. BOLD ITALIC "XL" LOGO -->
    <text 
      x="105" 
      y="355" 
      font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif" 
      font-style="italic" 
      font-weight="900" 
      font-size="205" 
      fill="#0f172a" 
      letter-spacing="-8"
    >
      XL
    </text>

    <!-- 3. DYNAMIC DUAL SWOOSH WINGS -->
    <!-- Top Black Inner Swoosh Arc -->
    <path d="M 180 220 C 240 145 320 160 355 215 C 330 185 270 180 220 230 Z" fill="#0f172a" />

    <!-- Middle Vibrant Orange Curved Wing -->
    <path d="M 315 150 C 390 155 425 240 325 348 C 390 270 385 190 315 150 Z" fill="url(#orangeGradRoot)" />

    <!-- Outer Black Dynamic Speed Tail -->
    <path d="M 420 168 C 452 230 435 320 250 415 C 385 355 440 280 420 168 Z" fill="#0f172a" />
  </g>
</svg>
